<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-label="Taranpreet Kalirao">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="t" x1="0" x2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f97316"/>
      <animate attributeName="x1" values="0;0.5;0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono { font-family: 'SF Mono', Menlo, Consolas, monospace; }
    .l { opacity: 0; }
    .l1 { animation: s 12s infinite; }
    .l2 { animation: s 12s infinite 3s; }
    .l3 { animation: s 12s infinite 6s; }
    .l4 { animation: s 12s infinite 9s; }
    @keyframes s { 0% {opacity:0} 2% {opacity:1} 22% {opacity:1} 25% {opacity:0} 100% {opacity:0} }
  </style>
  <rect width="1000" height="200" rx="16" fill="url(#bg)"/>
  <g fill="#fbbf24" filter="url(#glow)">
    <circle cx="120" cy="190" r="2.5"><animate attributeName="cy" values="200;20" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="195" r="2"><animate attributeName="cy" values="200;30" dur="5s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="5s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="195" r="3"><animate attributeName="cy" values="200;25" dur="6s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="190" r="2"><animate attributeName="cy" values="200;40" dur="4.5s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="4.5s" begin="1.5s" repeatCount="indefinite"/></circle>
  </g>
  <text class="mono" x="500" y="95" text-anchor="middle" font-size="52" font-weight="800" fill="url(#t)" filter="url(#glow)">Taranpreet Kalirao</text>
  <g class="mono" font-size="22" fill="#cbd5e1" text-anchor="middle">
    <text class="l l1" x="500" y="145">PySpark &amp; Spark SQL</text>
    <text class="l l2" x="500" y="145">Python • Data • Machine Learning</text>
    <text class="l l3" x="500" y="145">Data Engineering • Pipelines • Analytics</text>
    <text class="l l4" x="500" y="145">Always learning, always shipping</text>
  </g>
</svg>
